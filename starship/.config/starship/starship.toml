version_format = '${major}.${minor}'
format = ' [](fg:surface0)[$symbol($version)]($style)[](fg:surface0)'

[shell]
style = 'bg:surface0 fg:text bold'
format = ' [](fg:surface0)[$indicator]($style)[](fg:surface0)'

[shlvl]
style = 'bg:surface0 fg:yellow bold'
symbol = '󰹍 '
format = ' [](fg:surface0)[$symbol$shlvl]($style)[](fg:surface0)'

[singularity]
style = 'bg:surface0 fg:blue bold'
symbol = ' '
format = ' [](fg:surface0)[$symbol\[$env\]]($style)[](fg:surface0)'

