"$schema" = 'https://starship.rs/config-schema.json'

# Five lines:
#   1. blank
#   2. a rule ending in how the previous command went: ✓/✘, took, at
#   3. where you are: host, folder, git, then whatever $all finds
#   4. blank
#   5. ❯
# functions/_prompt_collapse drops line 3 once you press Enter, so scrollback
# keeps every result and command but not the context line. _prompt_render
# finds line 3 by position (third from last): keep the two in step.
add_newline = false

# Line breaks are $line_break, not literal newlines: $all adds every module
# not named here, line_break included.
format = """
$line_break\
$fill$status$cmd_duration$time[ ─](surface1)$line_break\
$username$hostname${env_var.STARSHIP_FOLDER}$git_branch$git_status$git_metrics$git_state$git_commit${env_var.STARSHIP_TICKET}${env_var.STARSHIP_PR}${env_var.STARSHIP_PR_PENDING}${env_var.STARSHIP_PR_CHANGES}${env_var.STARSHIP_PR_DRAFT}$terraform${env_var.STARSHIP_AWS_PROD}${env_var.STARSHIP_AWS}$all$line_break\
$line_break\
$character"""

palette = 'catppuccin-mocha'

[palettes.catppuccin-mocha]
rosewater = '#f5e0dc'
flamingo = '#f2cdcd'
pink = '#f5c2e7'
mauve = '#cba6f7'
red = '#f38ba8'
maroon = '#eba0ac'
peach = '#fab387'
yellow = '#f9e2af'
green = '#a6e3a1'
teal = '#94e2d5'
sky = '#89dceb'
sapphire = '#74c7ec'
blue = '#89b4fa'
lavender = '#b4befe'
text = '#cdd6f4'
subtext1 = '#bac2de'
subtext0 = '#a6adc8'
overlay2 = '#9399b2'
overlay1 = '#7f849c'
overlay0 = '#6c7086'
surface2 = '#585b70'
surface1 = '#45475a'
surface0 = '#313244'
base = '#1e1e2e'
mantle = '#181825'
crust = '#11111b'

# Line 2: the rule ---------------------------------------------------------

[fill]
symbol = '─'
style = 'surface1'

# ✓ on success. On failure: ✘ alone for ordinary errors, words for the codes
# that mean something (not found, interrupted…), the number for anything else.
[status]
disabled = false
map_symbol = true
recognize_signal_code = true
success_symbol = '✓'
symbol = '✘'
not_found_symbol = '✘ not found'
not_executable_symbol = '✘ not executable'
sigint_symbol = '✘ interrupted'
signal_symbol = '✘ signal'
success_style = 'bold green'
failure_style = 'bold red'
format = ' [$symbol( $maybe_int)]($style)'

[cmd_duration]
style = 'bold yellow'
format = ' [took](overlay0) [$duration]($style)'

[time]
disabled = false
style = 'subtext0'
time_format = '%H:%M'
format = ' [at](overlay0) [$time]($style)'

# Line 5: ❯ ----------------------------------------------------------------
# One colour always: the rule already shows how the last command went.

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold green)'

# Line 3: context, as pills ----------------------------------------------
# Each pill: a rounded cap glyph (Nerd Font), the text with no padding, then a
# closing cap. Pills that touch (the git ones) are fused into one ribbon with
# round dividers by functions/_prompt_render; the others keep a space so they
# stay separate. Folder and branch are solid; git details sit on surface0 with
# coloured text so they read as detail. Each git detail starts with a space:
# one at the start, one between, none at the end.

[hostname]
style = 'bg:peach fg:crust bold'
format = '[](fg:peach)[$ssh_symbol$hostname]($style)[](fg:peach) '

# Folder, ticket and PR: set by functions/_prompt_context. In a git repository
# the folder pill names the project instead of the folder (a worktree's folder
# repeats its branch). Ticket and PR are links: Cmd-click to open.

[env_var.STARSHIP_FOLDER]
style = 'bg:blue fg:crust bold'
format = '[](fg:blue)[$env_value]($style)[](fg:blue) '

[directory] # replaced by env_var.STARSHIP_FOLDER
disabled = true

[env_var.STARSHIP_TICKET]
style = 'bg:yellow fg:crust bold'
format = ' [](fg:yellow)[ $env_value]($style)[](fg:yellow)'

[env_var.STARSHIP_PR] # approved, or no review needed
style = 'bg:green fg:crust bold'
format = ' [](fg:green)[ $env_value]($style)[](fg:green)'

[env_var.STARSHIP_PR_PENDING] # waiting for review
style = 'bg:peach fg:crust bold'
format = ' [](fg:peach)[ $env_value]($style)[](fg:peach)'

[env_var.STARSHIP_PR_CHANGES] # changes requested
style = 'bg:red fg:crust bold'
format = ' [](fg:red)[ $env_value]($style)[](fg:red)'

[env_var.STARSHIP_PR_DRAFT] # draft
style = 'bg:surface0 fg:overlay2 bold'
format = ' [](fg:surface0)[ $env_value]($style)[](fg:surface0)'

[git_branch]
style = 'bg:mauve fg:crust bold'
format = '[](fg:mauve)[$symbol$branch(:$remote_branch)]($style)[](fg:mauve)'
symbol = ' '
truncation_length = 30
truncation_symbol = '…'

[git_status]
style = 'bg:surface0 fg:peach bold'
format = '([](fg:surface0)[$all_status$ahead_behind]($style)[](fg:surface0))'
conflicted = '  $count'
stashed = '  $count'
deleted = '  $count'
renamed = '  $count'
modified = '  $count'
typechanged = ' ~$count'
staged = '  $count'
untracked = '  $count'
ahead = ' $count'
behind = ' $count'
diverged = ' $ahead_count$behind_count'

[git_metrics]
disabled = false
added_style = 'bg:surface0 fg:green bold'
deleted_style = 'bg:surface0 fg:red bold'
format = '([](fg:surface0)[ +$added]($added_style)[](fg:surface0))([](fg:surface0)[ -$deleted]($deleted_style)[](fg:surface0))'

[git_state]
style = 'bg:surface0 fg:yellow bold'
format = '([](fg:surface0)[ $state( $progress_current/$progress_total)]($style)[](fg:surface0))'

[git_commit] # shown when HEAD is detached, e.g. mid-rebase
style = 'bg:surface0 fg:overlay2 bold'
format = '([](fg:surface0)[  $hash$tag]($style)[](fg:surface0))'

[terraform]
style = 'bg:teal fg:crust bold'
format = ' [](fg:teal)[$symbol$workspace]($style)[](fg:teal)'

[jobs]
style = 'bg:sky fg:crust bold'
number_threshold = 1
format = ' [](fg:sky)[$symbol$number]($style)[](fg:sky)'

# Claude Code status line ------------------------------------------------
# claude/.claude/statusline runs this profile: the context line above, then
# the model with its details fused on like git status (effort, fast mode, how
# full the context is), from env vars that script sets.

[profiles]
claude-code = "${env_var.STARSHIP_FOLDER}$git_branch$git_status$git_metrics$git_state$git_commit${env_var.STARSHIP_TICKET}${env_var.STARSHIP_PR}${env_var.STARSHIP_PR_PENDING}${env_var.STARSHIP_PR_CHANGES}${env_var.STARSHIP_PR_DRAFT}$claude_model${env_var.STARSHIP_CLAUDE_EFFORT}${env_var.STARSHIP_CLAUDE_FAST}${env_var.STARSHIP_CLAUDE_CONTEXT}${env_var.STARSHIP_CLAUDE_CONTEXT_WARM}${env_var.STARSHIP_CLAUDE_CONTEXT_HOT}"

[claude_model]
style = 'bg:lavender fg:crust bold'
symbol = '󰚩 '
format = ' [](fg:lavender)[$symbol$model]($style)[](fg:lavender)'

[claude_context] # replaced by the env_var pills below
disabled = true

[claude_cost]
disabled = true

[env_var.STARSHIP_CLAUDE_EFFORT] # dots: one for low up to five for max
style = 'bg:surface0 fg:sky bold'
format = '[](fg:surface0)[ $env_value]($style)[](fg:surface0)'

[env_var.STARSHIP_CLAUDE_FAST]
style = 'bg:surface0 fg:yellow bold'
format = '[](fg:surface0)[ $env_value]($style)[](fg:surface0)'

[env_var.STARSHIP_CLAUDE_CONTEXT] # a pie that fills up to 100k tokens
style = 'bg:surface0 fg:green bold'
format = '[](fg:surface0)[ $env_value]($style)[](fg:surface0)'

[env_var.STARSHIP_CLAUDE_CONTEXT_WARM] # from 60k
style = 'bg:surface0 fg:yellow bold'
format = '[](fg:surface0)[ $env_value]($style)[](fg:surface0)'

[env_var.STARSHIP_CLAUDE_CONTEXT_HOT] # past 100k
style = 'bg:surface0 fg:red bold'
format = '[](fg:surface0)[ $env_value]($style)[](fg:surface0)'

# Runtimes and tools: grey pills with coloured text, like nodejs. The AWS
# pills read variables set by functions/_prompt_aws (in the format line above).

[env_var.STARSHIP_AWS] # set from $AWS_PROFILE by functions/_prompt_aws
style = 'bg:surface0 fg:peach bold'
format = ' [](fg:surface0)[ $env_value]($style)[](fg:surface0)'

[env_var.STARSHIP_AWS_PROD] # any profile with "prod" in its name
style = 'bg:red fg:crust bold'
format = ' [](fg:red)[ $env_value]($style)[](fg:red)'

